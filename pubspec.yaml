name: ijs_vault
description: "A new Flutter project."

# Prevent accidental publishing
publish_to: 'none'

# App versioning
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  gradient_borders: ^1.0.2
  flutter_svg: ^2.2.3
  get: ^4.7.3
  # flutter_otp_text_field: ^1.5.1+1
  pinput: ^6.0.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  flutter_spinkit: ^5.2.2
  flutter_shake_animated: ^0.0.5
  dio: ^5.9.0
  shared_preferences: ^2.5.4
  fluttertoast: ^9.0.0
  shimmer: ^3.0.0
  file_picker: ^10.3.8
  image_picker: ^1.2.1
  intl: ^0.20.2
  file_icon: ^1.0.0
  firebase_core: ^2.25.4
  firebase_messaging: ^14.7.10
  device_info_plus: ^10.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets (enable later if needed)
  assets:
    - assets/images/
    - assets/svgs/

  #   - assets/icons/

  # Custom Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
